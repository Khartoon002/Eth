
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OPay Auto QR Payment</title>
</head>
<body>
  <!-- Your Make Payment button -->
  <button id="makePaymentBtn"
          style="padding:12px 24px;font-size:16px;background:#00c46a;color:#fff;border:none;border-radius:6px;cursor:pointer;">
    Make Payment with OPay
  </button>

  <!-- Hidden OPay QR image (real QR from OPay app) -->
  <img id="opayQr"
       src="opay-qr.png"  <!-- 👈 change this to your actual QR image path -->
       alt="OPay QR"
       style="display:none;" />

  <!-- jsQR library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    const button = document.getElementById("makePaymentBtn");
    const qrImg = document.getElementById("opayQr");

    button.addEventListener("click", () => {
      if (!qrImg.complete) {
        qrImg.onload = () => decodeOpayQr(qrImg);
      } else {
        decodeOpayQr(qrImg);
      }
    });

    function decodeOpayQr(img) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;

      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);

      if (!code) {
        alert("Could not read the OPay QR. Please use the real QR image from the OPay app.");
        return;
      }

      const payload = code.data.trim();
      console.log("Decoded QR data:", payload);

      if (/^https?:\/\//i.test(payload) ||
          /^opay:/i.test(payload) ||
          /^ope:\/\//i.test(payload)) {
        window.location.href = payload;
      } else {
        alert("QR scanned, but it does not look like a link:\n\n" + payload);
      }
    }
  </script>
</body>
</html>
